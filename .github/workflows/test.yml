name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: ['18', '20', '22']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm run test:coverage

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/coverage-final.json

  # Single stable gate context for branch protection (the matrix job names like
  # "test (20)" are version-specific and brittle to require directly).
  tests-passed:
    name: tests-passed
    needs: [test]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Gate on the test matrix
        run: |
          r="${{ needs.test.result }}"
          if [ "$r" = "success" ] || [ "$r" = "skipped" ]; then
            echo "tests-passed: $r"
          else
            echo "test matrix result: $r"; exit 1
          fi

